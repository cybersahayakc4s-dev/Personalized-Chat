name: Desktop Release (Windows Build & Publish)

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'electron/**'
      - 'client/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    name: Check Desktop Release Trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      app_version: ${{ steps.detect.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version or code changes
        id: detect
        run: |
          # If triggered manually via workflow_dispatch, always build current version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP_VERSION=$(node -p "require('./package.json').version || ''")
            echo "Manual workflow dispatch trigger detected for version $APP_VERSION."
            echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="HEAD~1"
          fi

          echo "Comparing push range: $BEFORE_SHA .. ${{ github.sha }}"

          # 1. Read current app version from root package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version || ''")
          echo "Current package.json version: $CURRENT_VERSION"
          echo "app_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # 2. Query published production version from live VPS latest.yml
          LIVE_VERSION=$(curl -sf -H "User-Agent: GitHub-Actions-CI" https://chat.cybersahayak.cloud/download/desktop/latest.yml 2>/dev/null | grep -E '^version:' | awk '{print $2}' | tr -d '\r\n' || echo "")
          echo "Live published version on VPS: ${LIVE_VERSION:-<none>}"

          # If live version exists on VPS, use it as baseline.
          # If VPS is reachable but has no latest.yml yet, this is the initial release (baseline is empty).
          # Otherwise (offline/unreachable), fall back to BEFORE_SHA:package.json.
          if [ -n "$LIVE_VERSION" ]; then
            PREV_VERSION="$LIVE_VERSION"
          elif curl -sf -H "User-Agent: GitHub-Actions-CI" https://chat.cybersahayak.cloud/health >/dev/null 2>&1; then
            echo "Verified live VPS is online; no desktop release published yet (initial release)."
            PREV_VERSION=""
          else
            PREV_VERSION=$(git show "$BEFORE_SHA:package.json" 2>/dev/null | node -p "try { JSON.parse(fs.readFileSync(0, 'utf8')).version || '' } catch(e) { '' }" || echo "")
          fi
          echo "Baseline previous version: ${PREV_VERSION:-<none>}"

          # 3. Check if files in electron/ or client/ changed
          CHANGED_DESKTOP_FILES=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" -- electron/ client/ || true)
          if [ -n "$CHANGED_DESKTOP_FILES" ]; then
            HAS_DESKTOP_FILES="true"
          else
            HAS_DESKTOP_FILES="false"
          fi

          # 4. Strictly evaluate semver increase vs unbumped desktop changes via Python
          export CURRENT_VERSION PREV_VERSION HAS_DESKTOP_FILES
          export PY_CODE='
          import os, re, sys

          curr = os.environ.get("CURRENT_VERSION", "").strip()
          prev = os.environ.get("PREV_VERSION", "").strip()
          has_desktop_files = os.environ.get("HAS_DESKTOP_FILES", "false") == "true"

          def parse_semver(v):
              if not v:
                  return None
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$", v.strip())
              if not m:
                  return None
              return (int(m.group(1)), int(m.group(2)), int(m.group(3)), m.group(4))

          def is_greater(v1, v2):
              s1 = parse_semver(v1)
              s2 = parse_semver(v2)
              if not s1 or not s2:
                  return False
              if (s1[0], s1[1], s1[2]) > (s2[0], s2[1], s2[2]):
                  return True
              if (s1[0], s1[1], s1[2]) < (s2[0], s2[1], s2[2]):
                  return False
              if not s1[3] and s2[3]:
                  return True
              if s1[3] and not s2[3]:
                  return False
              if s1[3] and s2[3]:
                  return s1[3] > s2[3]
              return False

          # Validate current version semver format
          s_curr = parse_semver(curr)
          if not s_curr:
              print("ERROR_INVALID_SEMVER")
              sys.exit(0)

          # Check if version was changed
          if curr != prev:
              if prev:
                  s_prev = parse_semver(prev)
                  if not s_prev or not is_greater(curr, prev):
                      print("ERROR_NOT_GREATER")
                      sys.exit(0)
              print("RELEASE")
              sys.exit(0)

          # Version did NOT change
          if has_desktop_files:
              print("ERROR_UNBUMPED_DESKTOP_CHANGES")
              sys.exit(0)

          print("SKIP")
          '

          EVAL_RESULT=$(python3 -c "import os, textwrap; exec(compile(textwrap.dedent(os.environ['PY_CODE']), '<evaluator>', 'exec'))")

          case "$EVAL_RESULT" in
            "RELEASE")
              echo "Valid semver bump detected (${PREV_VERSION:-<none>} -> $CURRENT_VERSION). Proceeding with desktop release build."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            "ERROR_UNBUMPED_DESKTOP_CHANGES")
              echo "::error::Desktop-affecting files changed in electron/ or client/ but package.json version was not bumped. Bump the version before merging to trigger a real desktop release."
              echo "Changed desktop files:"
              echo "$CHANGED_DESKTOP_FILES"
              exit 1
              ;;
            "ERROR_NOT_GREATER")
              echo "::error::package.json version '${CURRENT_VERSION}' is not a valid semver increase over previous version '${PREV_VERSION}'. Bump the version to a higher semver before merging."
              exit 1
              ;;
            "ERROR_INVALID_SEMVER")
              echo "::error::package.json version '${CURRENT_VERSION}' is not a valid semantic version (expected MAJOR.MINOR.PATCH)."
              exit 1
              ;;
            "SKIP")
              echo "No version bump and no electron/client changes detected in commit range. Skipping desktop release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Unexpected evaluation result: $EVAL_RESULT"
              exit 1
              ;;
          esac

  build-windows:
    name: Build Windows Installer (x64)
    needs: check-changes
    if: needs.check-changes.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client production bundle
        working-directory: client
        run: npm run build

      - name: Build Windows NSIS Installer (x64)
        run: npm run dist

      - name: Verify release artifacts exist
        shell: bash
        run: |
          VERSION="${{ needs.check-changes.outputs.app_version }}"
          echo "Verifying generated release files for version $VERSION in dist-electron/..."

          EXE_FILE="dist-electron/Personalize Chat Setup ${VERSION}.exe"
          YAML_FILE="dist-electron/latest.yml"
          BLOCKMAP_FILE="dist-electron/Personalize Chat Setup ${VERSION}.exe.blockmap"

          if [ ! -f "$EXE_FILE" ]; then
            echo "::error::Missing expected installer binary: $EXE_FILE"
            ls -la dist-electron/
            exit 1
          fi

          if [ ! -f "$YAML_FILE" ]; then
            echo "::error::Missing update manifest: $YAML_FILE"
            exit 1
          fi

          if [ ! -f "$BLOCKMAP_FILE" ]; then
            echo "::error::Missing blockmap file: $BLOCKMAP_FILE"
            exit 1
          fi

          echo "All release artifacts verified successfully:"
          ls -la "$EXE_FILE" "$YAML_FILE" "$BLOCKMAP_FILE"

      - name: Upload release artifacts for publish job
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-v${{ needs.check-changes.outputs.app_version }}
          path: |
            dist-electron/Personalize Chat Setup ${{ needs.check-changes.outputs.app_version }}.exe
            dist-electron/Personalize Chat Setup ${{ needs.check-changes.outputs.app_version }}.exe.blockmap
            dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 90

  publish-vps:
    name: Publish Release to VPS Download Server
    needs: [check-changes, build-windows]
    if: needs.check-changes.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-v${{ needs.check-changes.outputs.app_version }}
          path: release-artifacts

      - name: Verify downloaded artifacts
        run: |
          TARGET_VERSION="${{ needs.check-changes.outputs.app_version }}"
          echo "Verifying downloaded artifacts for version $TARGET_VERSION..."
          ls -la release-artifacts/
          test -f "release-artifacts/Personalize Chat Setup ${TARGET_VERSION}.exe" || { echo "::error::Missing exe in release-artifacts"; exit 1; }
          test -f "release-artifacts/Personalize Chat Setup ${TARGET_VERSION}.exe.blockmap" || { echo "::error::Missing blockmap in release-artifacts"; exit 1; }
          test -f "release-artifacts/latest.yml" || { echo "::error::Missing latest.yml in release-artifacts"; exit 1; }
          echo "All 3 release artifacts confirmed present."

      - name: Prepare VPS directories and archive prior release
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_VERSION: ${{ needs.check-changes.outputs.app_version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: TARGET_VERSION
          script_stop: true
          script: |
            set -euo pipefail
            BASE_DIR="/opt/company/apps/personalize-chat/download/desktop"
            ARCHIVE_DIR="$BASE_DIR/archive"
            STAGING_DIR="$BASE_DIR/.staging"

            echo "=== [1/3] Ensuring release directories exist on VPS ==="
            mkdir -p "$BASE_DIR" "$ARCHIVE_DIR" "$STAGING_DIR"

            echo "=== [2/3] Archiving existing release files (retention safety) ==="
            if [ -f "$BASE_DIR/latest.yml" ]; then
              PREV_VERSION=$(grep -E '^version:' "$BASE_DIR/latest.yml" | awk '{print $2}' | tr -d '\r\n' || echo "")
              if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$TARGET_VERSION" ]; then
                echo "Archiving previous version $PREV_VERSION files..."
                mv "$BASE_DIR"/*"$PREV_VERSION"* "$ARCHIVE_DIR/" 2>/dev/null || true
              fi
            fi

            echo "=== [3/3] Pruning older archives (retaining last 2 previous versions) ==="
            cd "$ARCHIVE_DIR"
            COUNT=$(find . -maxdepth 1 -name "*.exe" 2>/dev/null | wc -l)
            if [ "$COUNT" -gt 2 ]; then
              ls -t *.exe | tail -n +3 | while read -r old_exe; do
                echo "Pruning older release archive: $old_exe and blockmap"
                rm -f "$old_exe" "${old_exe}.blockmap"
              done
            else
              echo "No older archives to prune (found $COUNT archives)."
            fi

      - name: Upload release artifacts to staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "release-artifacts/*"
          target: "/opt/company/apps/personalize-chat/download/desktop/.staging"
          strip_components: 1

      - name: Atomically promote staged release to live
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_VERSION: ${{ needs.check-changes.outputs.app_version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: TARGET_VERSION
          script_stop: true
          script: |
            set -euo pipefail
            BASE_DIR="/opt/company/apps/personalize-chat/download/desktop"
            STAGING_DIR="$BASE_DIR/.staging"

            echo "=== Validating staged files before live promotion ==="
            EXE_NAME="Personalize Chat Setup ${TARGET_VERSION}.exe"
            test -f "$STAGING_DIR/$EXE_NAME" || { echo "::error::Staged exe missing: $STAGING_DIR/$EXE_NAME"; exit 1; }
            test -f "$STAGING_DIR/${EXE_NAME}.blockmap" || { echo "::error::Staged blockmap missing"; exit 1; }
            test -f "$STAGING_DIR/latest.yml" || { echo "::error::Staged latest.yml missing"; exit 1; }

            echo "Promoting staged files to live download directory..."
            # Move binary and blockmap first, manifest last so clients never see latest.yml before exe exists
            mv "$STAGING_DIR/$EXE_NAME" "$BASE_DIR/"
            mv "$STAGING_DIR/${EXE_NAME}.blockmap" "$BASE_DIR/"
            mv "$STAGING_DIR/latest.yml" "$BASE_DIR/"

            rm -rf "$STAGING_DIR"

            echo "Desktop release v${TARGET_VERSION} published successfully to $BASE_DIR!"
            ls -la "$BASE_DIR"
